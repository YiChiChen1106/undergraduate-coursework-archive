name: Import verified coursework archive

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download, verify, and commit the prepared archive
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          export LC_ALL=C.UTF-8
          archive_dir="$RUNNER_TEMP/coursework-download"
          checkout_dir="$RUNNER_TEMP/coursework-checkout"
          mkdir -p "$archive_dir"
          gh release download archive-2026-10-30 --repo YiChiChen1106/undergraduate-coursework-archive --pattern undergraduate-coursework-public-2026-10-30.zip --dir "$archive_dir"
          cd "$archive_dir"
          printf '%s\n' 'd8d487a5f16f4ffe03500951c7e3f6758cb16fb71921b66524e692cc03fb1266  undergraduate-coursework-public-2026-10-30.zip' | sha256sum --check --strict
          gh auth setup-git
          git clone --depth=1 https://github.com/YiChiChen1106/undergraduate-coursework-archive.git "$checkout_dir"
          cd "$checkout_dir"
          git config core.autocrlf false
          git config core.filemode false
          git config user.name YiChiChen1106
          git config user.email 272391300+YiChiChen1106@users.noreply.github.com
          python3 -m zipfile -e "$archive_dir/undergraduate-coursework-public-2026-10-30.zip" "$checkout_dir"
          python3 - "$archive_dir/undergraduate-coursework-public-2026-10-30.zip" <<'PY'
          import pathlib
          import subprocess
          import sys
          import zipfile
          with zipfile.ZipFile(sys.argv[1]) as archive:
              names = [item.filename for item in archive.infolist() if not item.is_dir()]
          assert len(names) == len(set(names)) == 2111
          allowed = {'courses', 'graduation', 'README.md', 'LICENSE', 'NOTICE.md', 'MANIFEST.csv', '.gitignore'}
          for name in names:
              path = pathlib.PurePosixPath(name)
              assert not path.is_absolute() and '..' not in path.parts
              assert path.parts[0] in allowed and '.git' not in path.parts
              assert '\n' not in name and '\r' not in name and not name.startswith('"')
              assert pathlib.Path(name).is_file(), name
          hashes = subprocess.check_output(
              ['git', 'hash-object', '-w', '--no-filters', '--stdin-paths'],
              input=('\n'.join(names) + '\n').encode('utf-8'),
          ).splitlines()
          assert len(hashes) == len(names)
          subprocess.run(['git', 'read-tree', '--empty'], check=True)
          entries = b''.join(b'100644 ' + sha + b'\t' + name.encode('utf-8') + b'\0' for sha, name in zip(hashes, names))
          subprocess.run(['git', 'update-index', '-z', '--index-info'], input=entries, check=True)
          print('Imported exact archive file list:', len(names))
          PY
          actual_tree="$(git write-tree)"
          printf 'Imported material tree: %s\n' "$actual_tree"
          test "$actual_tree" = d618ec2c310e475ad39c69cf6b151ddd27c891a9
          git add -- .github/workflows/import-coursework.yml
          git commit -q -m 'Import organized coursework and graduation projects with privacy redactions'
          git push origin HEAD:main
          printf 'Verified material tree: %s\n' "$actual_tree"
